[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-game"
version = "0.1.0"
description = "Evidence-led game analysis from gameplay recordings"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
rea-game = "rea_game.cli:main"

[tool.setuptools.packages.find]
include = ["rea_game*"]

[tool.setuptools.package-data]
rea_game = ["SKILL.md"]
