name: Tests and packages
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install development tools
        run: python -m pip install -e . build twine
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate metadata
        run: python -m twine check dist/rea_game-0.1.0-py3-none-any.whl dist/rea_game-0.1.0.tar.gz
      - name: Verify isolated wheel installation
        run: python scripts/check_distribution.py dist/rea_game-0.1.0-py3-none-any.whl
      - name: Verify isolated source installation
        run: python scripts/check_distribution.py dist/rea_game-0.1.0.tar.gz
